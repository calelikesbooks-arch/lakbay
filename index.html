<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LAKBAY: Biyahe mo, gabay namin. Research-backed commuting guide for Marilao, Meycauayan, Bocaue and Metro Manila. Early development build." />
    <meta name="theme-color" content="#f5f7fb" />
    <title>LAKBAY · Biyahe mo, gabay namin.</title>
    <!-- Applies the saved theme before the page paints, to avoid a white flash in dark mode. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('lakbay-theme');
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked: fall back to light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LAKBAY needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
